project_id = "oklyqnoqzbhjudqbkulq"

# Pre-authentication endpoint: callers have no session yet, so the gateway must not
# require a user JWT. The function authenticates by checking the password itself.
[functions.login-with-code]
verify_jwt = false

# Public staff signup through a hospital's signup link: the caller has no account yet.
# The function validates the link token and throttles by IP itself.
[functions.staff-signup]
verify_jwt = false

[functions.device-ingest]
# Devices sign in with their own device key (checked in the function), not a user session.
verify_jwt = false

# The daily Demo round, called by pg_cron (20261009091719_demo_lifecycle_schedule) with no user
# session: the function checks the x-cron-secret header against the Vault secret itself, and also
# accepts the platform owner's session (Studio "run now"), which it verifies on its own.
[functions.demo-lifecycle]
verify_jwt = false

# Called by the database scheduler with the cron secret; it checks that (or the platform owner) itself.
[functions.reminders]
verify_jwt = false

# Editing a staff account (name, email, role, access). The live project runs this function with the gateway
# check off (found on 01/11/2026). The function checks the caller itself: no valid session is refused with 401,
# anyone who is not an active admin with 403, and a hospital admin cannot change another admin (only the platform
# owner). It is recorded here so that a deploy from this repository does not change the setting quietly. Turning
# the gateway check on would be a separate decision, tried first with a real admin session.
[functions.update-staff]
verify_jwt = false

# «Ζητήστε παρουσίαση» on the public first page: visitors are not signed in. The function limits requests itself.
[functions.contact-request]
verify_jwt = false
