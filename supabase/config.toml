project_id = "oklyqnoqzbhjudqbkulq"

# Pre-authentication endpoint: callers have no session yet, so the gateway must not
# require a user JWT. The function authenticates by checking the password itself.
[functions.login-with-code]
verify_jwt = false

# Public staff signup through a hospital's signup link: the caller has no account yet.
# The function validates the link token and throttles by IP itself.
[functions.staff-signup]
verify_jwt = false

[functions.device-ingest]
# Devices sign in with their own device key (checked in the function), not a user session.
verify_jwt = false

# The daily Demo round, called by pg_cron (20261009091719_demo_lifecycle_schedule) with no user
# session: the function checks the x-cron-secret header against the Vault secret itself, and also
# accepts the platform owner's session (Studio "run now"), which it verifies on its own.
[functions.demo-lifecycle]
verify_jwt = false
