<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>SurgiTrack</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: grid; place-items: center; background: #f6f8fb" role="status">
        <span
          aria-label="Φόρτωση…"
          style="
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 3px solid #d8e3e8;
            border-top-color: #1d6b7a;
            animation: boot-spin 0.8s linear infinite;
          "
        ></span>
      </div>
    </div>
    <style>
      body {
        margin: 0;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
