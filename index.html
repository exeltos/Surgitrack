<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <!--
      React Router's HashRouter looks for a <base> element (document.querySelector) on every Link it renders:
      without one, each look scans the whole page, which at a large hospital's size (thousands of rows with links)
      blocked the screen for over a second on every update. Found first here, it is found at once. No href, so
      it changes no address; target _self is what links do anyway.
    -->
    <base target="_self" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <meta
      name="description"
      content="SurgiTrack: λογισμικό αποστείρωσης και ιχνηλασιμότητας χειρουργικών εργαλείων (traceability) για την Κεντρική Αποστείρωση (ΚΑΠ) και τα χειρουργεία του νοσοκομείου. Σετ, κλίβανοι, λήξεις, υπογραφές και πλήρες ιστορικό, με barcode από το κινητό."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.surgitrack.eu/" />
    <!-- How a link to the site looks when it is shared (Viber, Facebook, LinkedIn, email). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SurgiTrack" />
    <meta property="og:locale" content="el_GR" />
    <meta property="og:url" content="https://www.surgitrack.eu/" />
    <meta property="og:title" content="SurgiTrack: Ιχνηλασιμότητα χειρουργικών εργαλείων & λογισμικό αποστείρωσης" />
    <meta
      property="og:description"
      content="Λογισμικό αποστείρωσης για ΚΑΠ και χειρουργεία: Σετ και εργαλεία από το τμήμα στην αποστείρωση και πίσω, με πλήρες ιστορικό."
    />
    <meta property="og:image" content="https://www.surgitrack.eu/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- What the site is, for search engines (schema.org); read as data, never run. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "SurgiTrack",
        "url": "https://www.surgitrack.eu/",
        "image": "https://www.surgitrack.eu/og-image.jpg",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Λογισμικό αποστείρωσης και ιχνηλασιμότητας χειρουργικών εργαλείων",
        "operatingSystem": "Web, Android",
        "inLanguage": ["el", "en"],
        "areaServed": "GR",
        "audience": {"@type": "Audience", "audienceType": "Νοσοκομεία, Κεντρική Αποστείρωση (ΚΑΠ), χειρουργεία"},
        "description": "Ιχνηλασιμότητα (traceability) χειρουργικών εργαλείων και Σετ: παραλαβή, καθαρισμός, σύνθεση, κλίβανος, αποδέσμευση και παράδοση, με λήξεις, δοκιμές κλιβάνων, υπογραφές και πλήρες ιστορικό ανά ασθενή.",
        "keywords": "ιχνηλασιμότητα εργαλείων, λογισμικό αποστείρωσης, ΚΑΠ νοσοκομείου, traceability χειρουργικών εργαλείων, κεντρική αποστείρωση, σετ χειρουργείου",
        "publisher": {"@type": "Organization", "name": "Exeltos", "url": "https://exeltos.com/"}
      }
    </script>
    <link rel="manifest" href="./app.webmanifest" />
    <link rel="apple-touch-icon" href="./scan-icon-180.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SurgiTrack | Ιχνηλασιμότητα χειρουργικών εργαλείων & λογισμικό αποστείρωσης</title>
    <style>
      body {
        margin: 0;
      }
      .boot-loader {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f8fb;
      }
      .boot-spinner {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 3px solid #d8e3e8;
        border-top-color: #1d6b7a;
        animation: boot-spin 0.8s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation-duration: 2s;
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <noscript>Το SurgiTrack χρειάζεται JavaScript για να λειτουργήσει. / SurgiTrack needs JavaScript to run.</noscript>
    <div id="root">
      <div class="boot-loader" role="status">
        <span class="boot-spinner" aria-label="Φόρτωση…"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
