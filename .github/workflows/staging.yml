name: Staging

# Brings the staging project (surgitrack-staging, fmxdyprtsgjkqrmejhah) up to date with the repository: applies the
# migrations it has not seen yet (scripts/staging/apply-migrations.sh) and, when asked, deploys the edge functions.
# Run it by hand: Actions, Staging, Run workflow. Nothing here can touch production: the script refuses a connection
# string that names it, or that does not name the staging project. See docs/STAGING.md.
#
# Needs the repository secret STAGING_DB_URL (the staging project's Session pooler connection string, with its
# database password), and for the functions also SUPABASE_ACCESS_TOKEN (a personal access token from the Supabase
# account). Without them the run fails at the first step, saying which one is missing.

on:
  workflow_dispatch:
    inputs:
      functions:
        description: Also deploy the edge functions to staging
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  database:
    name: Migrations on staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}

    steps:
      - name: Check the secret
        run: |
          if [ -z "$STAGING_DB_URL" ]; then
            echo "::error::STAGING_DB_URL is not set (see docs/STAGING.md)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the PostgreSQL 17 client (same major version as the projects)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Apply the migrations it has not seen
        run: bash scripts/staging/apply-migrations.sh

  functions:
    name: Edge functions on staging
    if: ${{ inputs.functions }}
    needs: database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check the secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set (see docs/STAGING.md)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # The staging project only: the reference is written here, never read from a secret.
      - name: Deploy the functions
        run: supabase functions deploy --project-ref fmxdyprtsgjkqrmejhah --use-api
