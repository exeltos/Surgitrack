name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unused CSS
        run: npm run css:unused
      - name: English translations
        run: npm run i18n:check
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
        env:
          # Placeholders: the build only checks that the settings exist.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci

  database:
    name: Database tests
    # Replays every migration on a throwaway PostgreSQL 16 (preinstalled on the runner) and runs supabase/tests/sql.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replay migrations and run SQL tests
        run: bash supabase/tests/run-local.sh

  accessibility:
    name: Accessibility
    # Every route for the hospital admin and a department user, desktop and phone, checked with axe-core
    # (WCAG 2 A/AA) against a mocked Supabase; fails on any serious or critical finding.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check every screen
        run: npm run screens -- --role ADMIN,DEPARTMENT --no-extras --max-height 900 --a11y --out screens-a11y

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-a11y
          path: screens-a11y
          retention-days: 7
