name: Sets export (temporary)

# Temporary, deleted after use: reads (read only) the Sets of ΧΕΙΡΟΥΡΓΕΙΟ and their instruments, and makes one Excel
# per Set, in a folder per specialty, kept as an artifact for one day.

on:
  push:
    branches: [claude/sets-export]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the Sets (read only)
        run: |
          sudo apt-get install -y -qq postgresql-client > /dev/null
          PGOPTIONS='-c default_transaction_read_only=on' psql "$SUPABASE_DB_URL" -X -q -tA -v ON_ERROR_STOP=1 \
            -f export-tmp/sets.sql > sets.json
          python3 -c "import json; d=json.load(open('sets.json')); print(len(d), 'Sets,', sum(len(x['tools']) for x in d), 'instruments')"
      - name: One Excel per Set
        run: |
          pip install -q openpyxl
          python3 export-tmp/make_set_xlsx.py sets.json "Σετ ΧΕΙΡΟΥΡΓΕΙΟΥ" > /dev/null
          zip -qr sets-xeirourgeio.zip "Σετ ΧΕΙΡΟΥΡΓΕΙΟΥ"
          ls -la sets-xeirourgeio.zip
          rm sets.json
      - uses: actions/upload-artifact@v4
        with:
          name: sets-xeirourgeio
          path: sets-xeirourgeio.zip
          retention-days: 1
