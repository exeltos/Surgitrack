name: Email templates

# Copies the emails in supabase/email-templates/ into the Supabase project (Authentication →
# Email Templates), so GitHub is where they are edited. Only the templates and their subjects
# change; every other auth setting stays as it is. Needs the SUPABASE_ACCESS_TOKEN secret
# (a personal access token from supabase.com/dashboard/account/tokens).
on:
  push:
    branches: [main]
    paths: ['supabase/email-templates/**', '.github/workflows/email-templates.yml']
  workflow_dispatch:

jobs:
  push-templates:
    name: Push email templates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_REF: oklyqnoqzbhjudqbkulq
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update the templates in Supabase
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set; the templates were not pushed."
            exit 0
          fi
          dir=supabase/email-templates
          jq -n \
            --rawfile invite "$dir/invite.html" \
            --rawfile recovery "$dir/recovery.html" \
            --rawfile confirmation "$dir/confirmation.html" \
            '{
              mailer_subjects_invite: "Πρόσκληση στο SurgiTrack",
              mailer_templates_invite_content: $invite,
              mailer_subjects_recovery: "Επαναφορά κωδικού SurgiTrack",
              mailer_templates_recovery_content: $recovery,
              mailer_subjects_confirmation: "Επιβεβαίωση email για το SurgiTrack",
              mailer_templates_confirmation_content: $confirmation
            }' > body.json
          status=$(curl -sS -o response.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @body.json)
          echo "Supabase answered $status"
          if [ "$status" -ge 300 ]; then
            cat response.json
            exit 1
          fi
          echo "Invite, password reset and email confirmation templates updated."
