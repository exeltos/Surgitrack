# Dependabot looks for newer versions of our libraries and of the GitHub Actions the CI uses, and opens a pull
# request for them. Kept quiet on purpose: once a month, everything that is a small update (minor or patch) in ONE
# pull request, and never a major version (React 19, Vite 8, ...): those need a plan and a visual check, so they
# are done by hand. GitHub Actions: one pull request a month with all of them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm-small-updates:
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ['*']
